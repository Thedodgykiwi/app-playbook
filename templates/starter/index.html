<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{APP_NAME}}</title>
  <meta name="theme-color" content="#495057" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Coloured stage banner (Dev, Alpha, Staging; LOCAL on your computer; none on Production)
       so test versions can't be mistaken for the live app, with a link to the pipeline page. -->
  <div id="stage-banner" hidden>
    <span id="stage-name"></span>
    <a id="pipeline-link" href="../pipeline/" hidden>Pipeline</a>
  </div>
  <!-- Google sign-in (account.js). Hidden until Firebase is set up: see firebase-config.js. -->
  <div id="account" class="account" hidden>
    <button type="button" id="sign-in" class="sign-in" hidden><span data-icon="google-logo"></span>Sign in</button>
    <button type="button" id="account-btn" class="avatar-btn" aria-expanded="false" aria-controls="account-menu" hidden>
      <span id="avatar" class="avatar" aria-hidden="true"></span><span id="sync-dot" class="sync-dot" aria-hidden="true"></span>
    </button>
    <div id="account-menu" class="account-menu" hidden>
      <p class="who"><strong id="account-name"></strong><span id="account-email"></span></p>
      <p id="sync-status" class="sync-status"></p>
      <button type="button" id="sign-out" class="plain-btn"><span data-icon="sign-out"></span>Sign out</button>
    </div>
  </div>

  <!-- The app goes here. -->
  <main id="app" class="placeholder" aria-label="{{APP_NAME}}"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="stage.js"></script>
  <script src="icons.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="account.js"></script>
</body>
</html>
